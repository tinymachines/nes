[package]
name = "nes-shell"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "The console in a window: the picture's decode and CRT stages on the GPU, held to ntsc-crt's CPU chain; wall-clock pacing with the drift policy; the keyboard and a gamepad as controller 1; audio out. The one crate here with registry dependencies, and nothing else depends on it."
repository = "https://github.com/tinymachines/nes"

[dependencies]
nes-bus = { git = "https://github.com/tinymachines/nes-bus", tag = "v0.1.1" }
nes-console = { path = "../nes-console" }
nes-glue = { path = "../nes-glue" }
ntsc-grid = { git = "https://github.com/tinymachines/ntsc-crt", tag = "v0.2.8" }
ntsc-source-nes = { git = "https://github.com/tinymachines/ntsc-crt", tag = "v0.2.8" }
ntsc-decode = { git = "https://github.com/tinymachines/ntsc-crt", tag = "v0.2.8" }
ntsc-crt = { git = "https://github.com/tinymachines/ntsc-crt", tag = "v0.2.8" }
ntsc-wasm = { git = "https://github.com/tinymachines/ntsc-crt", tag = "v0.2.8" }
wgpu = "22.1"
pollster = "0.3"
winit = "0.30"
cpal = "0.15"
gilrs = "0.11"

[[bin]]
name = "nes-shell"
path = "src/main.rs"
