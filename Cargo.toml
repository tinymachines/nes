[workspace]
resolver = "2"
members = ["crates/nes-glue", "crates/nes-console", "crates/nes-shell"]

# The chip crates measure their tables out of rung 0 at build time;
# unoptimised build scripts would take many times longer.
[profile.dev.build-override]
opt-level = 3
[profile.release.build-override]
opt-level = 3
